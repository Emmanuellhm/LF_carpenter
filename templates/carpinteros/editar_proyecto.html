{% extends 'base.html' %}
{% load static %}

{% block title %}Editar Proyecto - LF Carpinter{% endblock %}

{% block content %}
<div class="container mx-auto px-6 py-8">
  <div class="max-w-2xl mx-auto">
    <div class="bg-white rounded-xl shadow-lg p-8">
      <h1 class="text-3xl font-bold text-amber-800 mb-6">
        <i class="fas fa-edit mr-3"></i>Editar Proyecto
      </h1>

      <form method="POST" enctype="multipart/form-data" class="space-y-6">
        {% csrf_token %}

        <div>
          <label class="block text-stone-700 font-medium mb-2">Título del Proyecto *</label>
          <input type="text" name="title" value="{{ proyecto.title }}" required
                 class="w-full px-4 py-3 border border-stone-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-transparent">
        </div>

        <div>
          <label class="block text-stone-700 font-medium mb-2">Descripción *</label>
          <textarea name="description" rows="4" required
                    class="w-full px-4 py-3 border border-stone-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-transparent">{{ proyecto.description }}</textarea>
        </div>

        <div>
          <label class="block text-stone-700 font-medium mb-2">Precio (opcional)</label>
          <input type="number" name="price" value="{{ proyecto.price|default:'' }}" step="0.01"
                 class="w-full px-4 py-3 border border-stone-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-transparent">
        </div>

        <div>
          <label class="block text-stone-700 font-medium mb-2">Imagen del Proyecto</label>
          {% if proyecto.image %}
          <div class="mb-3">
            <img src="{{ proyecto.image.url }}" alt="{{ proyecto.title }}" class="w-48 h-48 object-cover rounded-lg">
            <p class="text-sm text-stone-500 mt-1">Imagen actual</p>
          </div>
          {% endif %}
          <input type="file" name="image" accept="image/*"
                 class="w-full px-4 py-3 border border-stone-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-transparent">
        </div>

        <div class="flex gap-4">
          <button type="submit" class="flex-1 bg-amber-700 text-white py-3 rounded-lg hover:bg-amber-800 transition font-medium">
            <i class="fas fa-save mr-2"></i>Guardar Cambios
          </button>
          <a href="{% url 'carpinteros:mis_proyectos' %}" class="flex-1 bg-stone-200 text-stone-700 py-3 rounded-lg hover:bg-stone-300 transition font-medium text-center">
            <i class="fas fa-times mr-2"></i>Cancelar
          </a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
