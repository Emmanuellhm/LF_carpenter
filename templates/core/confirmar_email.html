{% extends 'base.html' %}

{% block title %}Confirmar Email - LF Carpinter{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center py-12 px-4">
    <div class="max-w-md w-full">
        <div class="bg-white rounded-2xl shadow-xl p-8 text-center">
            <div class="mx-auto w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mb-4">
                <svg class="w-8 h-8 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-stone-800 mb-2">¡Cuenta confirmada!</h1>
            <p class="text-stone-600 mb-6">
                Tu cuenta ha sido verificada exitosamente. Ya puedes iniciar sesión y comenzar a usar LF Carpinter.
            </p>
            <a href="{% url 'login' %}"
               class="inline-block bg-gradient-to-r from-amber-600 to-amber-700 text-white py-3 px-6 rounded-lg font-medium hover:from-amber-700 hover:to-amber-800 transition shadow-md">
                Iniciar sesión
            </a>
        </div>
    </div>
</div>
{% endblock %}
