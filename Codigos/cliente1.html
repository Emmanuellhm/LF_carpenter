<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LF Carpinter - Perfil Cliente</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex min-h-screen bg-gradient-to-br from-amber-50 to-stone-100">

<!-- Sidebar -->
<aside class="w-64 bg-white shadow-xl flex flex-col justify-between border-r border-stone-200">
  <div>
    <div class="flex flex-col items-center py-8 border-b border-stone-200">
      <!-- Foto de perfil -->
      <img src="img/fotoP.jpg" alt="Foto Perfil"
           class="w-28 h-28 rounded-full border-4 border-amber-600 object-cover shadow-md" 
           id="foto-perfil">
      <span class="mt-3 font-bold text-stone-800 text-lg" id="nombre-usuario">Usuario</span>
    </div>
    <nav class="flex flex-col space-y-2 px-6 mt-6">
      <a href="cliente1.html" 
         class="text-stone-700 hover:bg-amber-100 rounded-lg px-4 py-2 font-medium">Perfil</a>
      <a href="historial.html" 
         class="text-stone-700 hover:bg-amber-100 rounded-lg px-4 py-2 font-medium">Historial Contrataciones</a>
      <a href="solicitudes.html" 
         class="text-stone-700 hover:bg-amber-100 rounded-lg px-4 py-2 font-medium">Solicitudes</a>
    </nav>
  </div>
  <div id="logout" class="text-center py-5 text-stone-500 hover:text-amber-600 cursor-pointer font-medium border-t border-stone-200">
    Cerrar sesión
  </div>
</aside>

  <!-- Main -->
  <div class="flex-1 flex flex-col">
    <header class="flex items-center justify-between bg-white border-b border-stone-200 px-6 h-20 shadow-sm">
      <div class="logo">
        <img src="img/Logo de Carpintería LF.png" alt="Logo" class="h-16 w-auto">
      </div>
      <nav>
        <a href="#" class="font-semibold text-stone-700 hover:text-amber-600">Contáctanos</a>
      </nav>
    </header>

    <main class="p-10">
      <h1 class="text-3xl font-extrabold text-stone-800 mb-6">Configura tu perfil</h1>
      <div id="perfil" class="seccion">
        <div class="bg-white p-8 rounded-xl shadow-lg max-w-lg border border-stone-200">
          <form class="space-y-5">
            <div>
              <label for="nueva-foto" class="block font-semibold text-stone-700">Cambiar foto de perfil</label>
              <input type="file" id="nueva-foto" accept="image/*"
                     class="w-full text-sm text-stone-600 file:mr-4 file:py-2 file:px-4 
                            file:rounded-lg file:border-0 
                            file:text-sm file:font-semibold 
                            file:bg-amber-600 file:text-white
                            hover:file:bg-amber-700 cursor-pointer">
            </div>
            <div>
              <label for="nombre" class="block font-semibold text-stone-700">Nombre</label>
              <input type="text" id="nombre" value="" class="w-full px-4 py-2 border border-stone-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-amber-500">
            </div>
            <div>
              <label for="correo" class="block font-semibold text-stone-700">Correo</label>
              <input type="email" id="correo" value="" class="w-full px-4 py-2 border border-stone-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-amber-500">
            </div>
            <div>
              <label for="ubicacion" class="block font-semibold text-stone-700">Ubicación</label>
              <input type="text" id="ubicacion" value="Medellín, Colombia" class="w-full px-4 py-2 border border-stone-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-amber-500">
            </div>
            <div>
              <label for="password" class="block font-semibold text-stone-700">Contraseña</label>
              <input type="password" id="password" placeholder="Nueva contraseña" class="w-full px-4 py-2 border border-stone-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-amber-500">
            </div>
            <button type="submit" class="w-full bg-amber-600 hover:bg-amber-700 text-white py-3 px-4 rounded-lg font-semibold shadow">Guardar cambios</button>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script>
    const userData = JSON.parse(localStorage.getItem("usuarioActivo"));
    if (!userData) {
      window.location.href = "iniciar-seccion.html";
    } else {
      document.getElementById("nombre-usuario").innerText = userData.nombre;
      document.getElementById("nombre").value = userData.nombre;
      document.getElementById("correo").value = userData.email;
    }

    const inputFoto = document.getElementById("nueva-foto");
    const fotoPerfil = document.getElementById("foto-perfil");
    inputFoto.addEventListener("change", (event) => {
      const archivo = event.target.files[0];
      if (archivo) {
        const reader = new FileReader();
        reader.onload = (e) => {
          fotoPerfil.src = e.target.result;
        };
        reader.readAsDataURL(archivo);
      }
    });

    document.getElementById("logout").addEventListener("click", () => {
      localStorage.removeItem("usuarioActivo");
      window.location.href = "iniciar-seccion.html";
    });
  </script>
  <!-- Footer (opcional) -->
  <footer class="mt-16 py-8 text-center text-stone-600 border-t border-stone-200">
    <p>&copy; 2025 LF Carpintería. Todos los derechos reservados.</p>
  </footer>

</body>
</html>
