<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - LF Carpinter</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-amber-50 to-stone-100 text-stone-800 font-sans">

  <!-- Header -->
  <header class="flex justify-between items-center px-8 h-20 bg-white shadow-md border-b border-stone-200">
    <div class="flex items-center">
      <img src="./img/Logo de Carpintería LF.png" alt="LF Logo" class="h-20 w-auto">
    </div>
    <nav class="flex gap-8 items-center">
      <a href="index2.html" class="font-medium text-stone-700 hover:text-amber-600">Página de inicio</a>
      <a href="contactanos.html" class="font-medium text-stone-700 hover:text-amber-600">Contáctanos</a>
      <a href="iniciar-seccion.html"
        class="font-semibold text-white bg-amber-600 hover:bg-amber-700 px-5 py-2 rounded-lg shadow">Iniciar sesión</a>
    </nav>
  </header>

  <!-- Main -->
  <main class="px-6 md:px-20 py-16">
    <h2 class="text-4xl font-extrabold text-center text-stone-800 mb-12">Iniciar Sesión</h2>

    <!-- Selección de rol -->
    <div class="flex justify-center gap-6 flex-wrap mb-12">
      <div class="card bg-white border border-stone-200 rounded-xl p-6 w-64 text-center cursor-pointer hover:shadow-lg transition"
        onclick="seleccionarRol(this, 'carpintero')">
        <div class="w-16 h-16 mx-auto flex items-center justify-center bg-amber-100 rounded-lg mb-4">
          <img src="./img/herramienta-de-martillo.png" alt="Carpintero" class="w-8 h-8">
        </div>
        <h3 class="text-xl font-bold mb-2">Carpintero</h3>
        <p class="text-sm text-stone-600">Accede a tu panel de carpintero</p>
      </div>

      <div class="card bg-white border border-stone-200 rounded-xl p-6 w-64 text-center cursor-pointer hover:shadow-lg transition"
        onclick="seleccionarRol(this, 'usuario')">
        <div class="w-16 h-16 mx-auto flex items-center justify-center bg-amber-100 rounded-lg mb-4">
          <img src="./img/nueva-cuenta.png" alt="Usuario" class="w-8 h-8">
        </div>
        <h3 class="text-xl font-bold mb-2">Usuario</h3>
        <p class="text-sm text-stone-600">Consulta proyectos o contrata servicios</p>
      </div>

      <div class="card bg-white border border-stone-200 rounded-xl p-6 w-64 text-center cursor-pointer hover:shadow-lg transition"
        onclick="seleccionarRol(this, 'admin')">
        <div class="w-16 h-16 mx-auto flex items-center justify-center bg-amber-100 rounded-lg mb-4">
          <img src="./img/administrador.png" alt="Administrador" class="w-8 h-8">
        </div>
        <h3 class="text-xl font-bold mb-2">Administrador</h3>
        <p class="text-sm text-stone-600">Gestiona la plataforma</p>
      </div>
    </div>

    <!-- Formulario -->
    <div id="form-container" class="hidden max-w-md mx-auto bg-white p-8 rounded-xl shadow-lg border border-stone-200">
      <!-- 🔹 Aquí conectamos con PHP -->
      <form id="login-form" action="login.php" method="post" class="space-y-5">
        <input type="hidden" id="rol" name="rol" value="">

        <div>
          <input type="email" id="email" name="email" placeholder="Correo electrónico" required
            class="w-full px-4 py-2 border border-stone-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-amber-500">
        </div>

        <div>
          <input type="password" id="password" name="password" placeholder="Contraseña" required
            class="w-full px-4 py-2 border border-stone-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-amber-500">
        </div>

        <button type="submit"
          class="w-full bg-amber-600 hover:bg-amber-700 text-white font-semibold py-3 rounded-lg shadow">
          Entrar
        </button>
      </form>
    </div>
  </main>

  <script>
    // Mostrar el formulario según el rol seleccionado
    function seleccionarRol(elemento, rol) {
      document.querySelectorAll('.card').forEach(card => card.classList.remove('ring-4', 'ring-amber-500'));
      elemento.classList.add('ring-4', 'ring-amber-500');

      document.getElementById('form-container').classList.remove('hidden');
      document.getElementById('rol').value = rol; // guardar el rol en el input oculto
    }
  </script>

</body>
</html>
