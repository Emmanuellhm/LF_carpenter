{% extends 'base.html' %}
{% load static %}

{% block title %}Subir Proyecto | LF Carpinter{% endblock %}

{% block content %}
<div class="min-h-[70vh] py-12 px-4 sm:px-6 lg:px-8 bg-amber-50">
  <div class="max-w-2xl mx-auto">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-gray-900">Subir Nuevo Proyecto</h1>
      <p class="mt-2 text-gray-600">Añade un nuevo proyecto a tu portafolio</p>
    </div>

    <form class="bg-white p-8 rounded-xl shadow-lg border border-amber-100" method="post" enctype="multipart/form-data">
      {% csrf_token %}

      <div class="space-y-6">
        <div>
          <label for="title" class="block font-semibold text-stone-700 mb-2">
            Título del Proyecto *
          </label>
          <input type="text" id="title" name="title" required
            class="w-full px-4 py-2 border border-stone-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-amber-500"
            placeholder="Ej: Mesa de comedor rústica">
        </div>

        <div>
          <label for="description" class="block font-semibold text-stone-700 mb-2">
            Descripción *
          </label>
          <textarea id="description" name="description" rows="4" required
            class="w-full px-4 py-2 border border-stone-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-amber-500"
            placeholder="Describe tu proyecto..."></textarea>
        </div>

        <div>
          <label for="price" class="block font-semibold text-stone-700 mb-2">
            Precio (opcional)
          </label>
          <input type="number" id="price" name="price" step="0.01" min="0"
            class="w-full px-4 py-2 border border-stone-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-amber-500"
            placeholder="Ej: 500000">
        </div>

        <div>
          <label for="image" class="block font-semibold text-stone-700 mb-2">
            Imagen del Proyecto
          </label>
          <input type="file" id="image" name="image" accept="image/*"
            class="w-full px-4 py-2 border border-stone-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-amber-500">
          <p class="text-sm text-stone-500 mt-1">Formatos permitidos: JPG, PNG, GIF</p>
        </div>
      </div>

      <div class="flex gap-3 pt-6">
        <a href="{% url 'carpinteros:mis_proyectos' %}"
           class="flex-1 px-5 py-3 rounded-lg text-stone-600 hover:bg-stone-100 font-medium transition border border-stone-300 text-center">
          Cancelar
        </a>
        <button type="submit"
           class="flex-1 px-5 py-3 rounded-lg bg-amber-600 text-white hover:bg-amber-700 font-bold shadow-lg transition">
          <i class="fas fa-upload mr-2"></i> Subir Proyecto
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
